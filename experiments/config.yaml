# =============================================================================
# NV Experiment Configuration
# =============================================================================
# Human-readable units throughout:
#   _tus  = microseconds    (laser/readout timing — qickdawg converts to _treg)
#   _tns  = nanoseconds     (laser/readout timing — qickdawg converts to _treg)
#   _fMHz = MHz             (frequency — qickdawg converts to _freg)
#
# Fine-resolution MW timing (pi/pi2 pulse durations) is stored under calibration
# in nanoseconds and converted to _tdds samples at runtime by config.py.


# -----------------------------------------------------------------------------
# Sample Being Observed
# -----------------------------------------------------------------------------
sample:
  name: "Minion"
  SIL: "D_o"


# -----------------------------------------------------------------------------
# Infrastructure
# -----------------------------------------------------------------------------
infrastructure:
  qick_ip: "192.168.3.1"
  qickdawg_version: "1.2.1"
  numpy_version: "1.26.4"


# -----------------------------------------------------------------------------
# Hardware / Channel Mapping
# -----------------------------------------------------------------------------
hardware:
  adc_channel: 0      # DAC B
  mw_channel: 0       # ADC D
  laser_gate_pmod: 0  # PMOD 0

# -----------------------------------------------------------------------------
# Photon Counting
# -----------------------------------------------------------------------------
photon_counting:
   edge_counting: true
   high_threshold: 8000
   low_threshold: 500

# -----------------------------------------------------------------------------
# Optics
# Update before each run series.
# -----------------------------------------------------------------------------
optics:
  excitation_laser_power_mW: 0.061   # REQUIRED — measure and update before running
  excitation_laser_wavelength_nm: 532


# -----------------------------------------------------------------------------
# Standard Pulse Timing
# Laser and readout parameters — assigned via qickdawg human-unit setters,
# which handle _treg conversion internally.
# -----------------------------------------------------------------------------
timing:
  relax_delay_tus: 2
  mw_to_laser_delay_tns: 555
  laser_on_tus: 6 # 4
  readout_integration_tns: 622 # 430
  laser_readout_offset_tus: 1.159 # 1.16
  readout_reference_start_tus: 5.0


# -----------------------------------------------------------------------------
# Other parameters used in shaping runs
# -----------------------------------------------------------------------------
other:
  reps: 10000
  get_reference: true
  pre_init: true


# -----------------------------------------------------------------------------
# Calibration
# Updated after calibration runs. Inherited by all subsequent experiments.
# Each NV transition has its own frequency, gain, and pulse durations since
# these are all interdependent — gain affects pi time, etc.
# -----------------------------------------------------------------------------
calibration:
  default_transition: lower_dip     # which transition build_nv_config() defaults to

  lower_dip:                        # ms = -1 transition
    mw_fMHz: 1845.8 # 1845.7
    mw_nqz: 1
    mw_gain: 32767                # 32767 is max
    mw_pi2_ftsamp: 134
    mw_pi_ftsamp: 268              # set after Rabi calibration at this frequency


  upper_dip:                        # ms = +1 transition
    mw_fMHz: 3895.05
    mw_nqz: 2                       # lower NQZ cutoff is 2.495 GHz
    mw_gain: 5000                   # may differ from lower_dip — recalibrate
    mw_pi_ftsamp: null
    mw_pi2_ftsamp: null